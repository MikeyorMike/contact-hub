# 轻contacts 的 Nginx 反向代理示例
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/contact-hub
#   sudo ln -sf /etc/nginx/sites-available/contact-hub /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # 没有域名就写 _，用公网 IP 直接访问
    server_name _;

    # 导入的 Excel 默认限制 8MB，这里放宽到 10MB
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源可以交给 Nginx 直接返回（可选）
    # location /css/ { alias /opt/contact-hub/public/css/; expires 1h; }
    # location /js/  { alias /opt/contact-hub/public/js/;  expires 1h; }
}
