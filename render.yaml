# Render Blueprint：把仓库连到 Render 后，选「New → Blueprint」即可一键部署
# 文档：https://render.com/docs/blueprint-spec
services:
  - type: web
    name: contact-hub
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # node:sqlite 需要 Node >= 22.5；这里直接用 24，避免旧版本要加实验性参数
      - key: NODE_VERSION
        value: "24.11.0"
      # 免费实例没有持久磁盘，数据写在 /tmp，实例重启后会回到种子数据
      - key: DATA_DIR
        value: /tmp/contact-hub-data
      - key: LOG_REQUESTS
        value: "0"
